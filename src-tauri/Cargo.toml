[package]
name = "daidori-manager-tauri"
version = "1.8.0"
description = "漫画の台割管理・入稿データ生成ツール"
authors = ["you"]
edition = "2021"

[lib]
name = "daidori_manager_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# 画像処理
image = { version = "0.25", features = ["jpeg", "png", "tiff"] }
psd = "0.3"
memmap2 = "0.9"
mozjpeg = "0.10"

# PDF読み込み（ラスタライズ用）
pdfium-render = { version = "0.8", features = ["thread_safe", "image"] }

# ファイル操作
walkdir = "2"
md5 = "0.7"
dirs = "5"
natord = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

# 非同期処理
tokio = { version = "1", features = ["full"] }

# 並列処理
rayon = "1.10"

# エラーハンドリング
thiserror = "1"
anyhow = "1"

# EPUB生成
zip = { version = "0.6", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }

# ========== プロファイル設定 ==========

# 開発モードでも依存クレートは最適化（画像処理を高速化）
[profile.dev.package."*"]
opt-level = 3

# 特に重要な画像処理クレートを明示的に最適化
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.psd]
opt-level = 3

[profile.dev.package.mozjpeg]
opt-level = 3

[profile.dev.package.png]
opt-level = 3

# jpeg-decoderはimageクレートの内部依存として自動的に最適化される

[profile.dev.package.tiff]
opt-level = 3

[profile.dev.package.zune-inflate]
opt-level = 3

[profile.dev.package.fdeflate]
opt-level = 3
